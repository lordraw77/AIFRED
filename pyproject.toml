[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aifred"
version = "0.4.0"
description = "A lean, self-hosted personal AI agent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alessandro Pioli"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "cryptography==50.0.2",
    "numpy==2.5.4",
    "pypdf==6.21.2",
    "pypdfium2==5.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
aifred = "aifred.__main__:main"

[tool.setuptools.packages.find]
include = ["aifred*"]

[tool.setuptools.package-data]
aifred = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
# E501 (line length) is not enforced: the code has no formatter and a few long lines read better unwrapped
select = ["E4", "E7", "E9", "F", "B", "W"]
